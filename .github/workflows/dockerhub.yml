name: workflow dockerhub
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Login to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Set Image Name
        id: vars
        run: echo "IMAGE_NAME=${{ secrets.ACR_USERNAME }}/$(basename ${{ github.repository}}) -daam" > "$GITHUB_ENV"
      
      - name: Build The Docker Image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push The Docker Image to ACR
        run: docker push $IMAGE_NAME:latest
        
